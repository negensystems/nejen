# Dialogs, pickers, and app quirks.

# Third-party windows that behave like panels: float centered at panel size.
# (NEJEN's own org.nejen.* windows get this from core/rules.conf.)
windowrule = float on, match:tag floating-window
windowrule = center on, match:tag floating-window
windowrule = size 900 620, match:tag floating-window
windowrule = tag +floating-window, match:class (org.gnome.NautilusPreviewer|org.gnome.Evince|com.gabm.satty|imv|mpv)

# File open/save pickers
windowrule = tag +floating-window, match:class (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus), match:title ^(Open.*Files?|Open [Ff]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[Cc]hoose.*)

# Small utility apps
windowrule = float on, match:class org.gnome.Calculator
windowrule = float on, match:class (Share|localsend)
windowrule = center on, match:class (Share|localsend)
windowrule = size 1080 720, match:class localsend

# Focus behavior fixes
windowrule = focus_on_activate off, match:class org.telegram.desktop
windowrule = stay_focused on, match:class .*[Rr]esolve.*, match:float 1

# JetBrains IDEs: splash, popups, and tooltips all misbehave under tiling
windowrule {
    name = jetbrains-splash
    match:class = ^(jetbrains-.*)$
    match:title = ^(splash)$
    match:float = 1
    center = on
    no_focus = on
    border_size = 0
}
windowrule {
    name = jetbrains-popup
    match:class = ^(jetbrains-.*)
    match:title = ^(| )$
    match:float = 1
    center = on
    stay_focused = on
    border_size = 0
    min_size = (monitor_w*0.5) (monitor_h*0.5)
}
windowrule {
    name = jetbrains-tooltip
    match:class = ^(jetbrains-.*)$
    match:title = ^(win.*)$
    match:float = 1
    no_initial_focus = on
}

# Overlay layers that must not animate
layerrule = no_anim on, match:namespace walker
layerrule = no_anim on, match:namespace selection
