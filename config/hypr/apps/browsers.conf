# Browser handling.
#
# Browsers manage their own surfaces, so they get near-full opacity and
# are grouped by engine family with tags for anything else that needs to
# tell them apart.

windowrule = tag +browser-blink, match:class ((google-)?[cC]hrom(e|ium)|[bB]rave-browser|[mM]icrosoft-edge|Vivaldi-stable|helium)
windowrule = tag +browser-gecko, match:class ([fF]irefox|zen|librewolf)

windowrule = tag -nejen-glass, match:tag browser-blink
windowrule = tag -nejen-glass, match:tag browser-gecko
windowrule = opacity 1.0 0.97, match:tag browser-blink
windowrule = opacity 1.0 0.97, match:tag browser-gecko

# Chromium --app windows sometimes spawn floating; force them to tile
windowrule = tile on, match:tag browser-blink

# Web video apps: fully opaque, no browser treatment
windowrule = tag -browser-blink, match:class (chrome-youtube.com__-Default|chrome-app.zoom.us__wc_home-Default)
windowrule = tag -nejen-glass, match:class (chrome-youtube.com__-Default|chrome-app.zoom.us__wc_home-Default)
