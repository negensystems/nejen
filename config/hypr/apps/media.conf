# Media and games: full opacity always (transparency ruins video), and
# idle inhibition where a fullscreen session means "watching/playing".

# Fully opaque media surfaces
windowrule = tag -nejen-glass, match:class ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer|qemu)$
windowrule = opacity 1 1, match:class ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer|qemu)$

# Picture-in-picture: small pinned overlay, bottom of nothing, top-right
windowrule = tag +pip, match:title .*Picture.?in.?[Pp]icture.*
windowrule = tag -nejen-glass, match:tag pip
windowrule = float on, match:tag pip
windowrule = pin on, match:tag pip
windowrule = size 640 360, match:tag pip
windowrule = keep_aspect_ratio on, match:tag pip
windowrule = border_size 0, match:tag pip
windowrule = opacity 1 1, match:tag pip
windowrule = move (monitor_w-window_w-32) (monitor_h*0.05), match:tag pip

# Webcam overlay drawn by nejen screenrecord
windowrule = float on, match:title nejen-webcam
windowrule = pin on, match:title nejen-webcam
windowrule = no_initial_focus on, match:title nejen-webcam
windowrule = no_dim on, match:title nejen-webcam
windowrule = move (monitor_w-window_w-40) (monitor_h-window_h-40), match:title nejen-webcam

# Steam: floating client windows, opaque, no idle lock mid-game
windowrule = float on, match:class steam
windowrule = center on, match:class steam, match:title Steam
windowrule = size 1120 720, match:class steam, match:title Steam
windowrule = size 480 780, match:class steam, match:title Friends List
windowrule = tag -nejen-glass, match:class steam.*
windowrule = opacity 1 1, match:class steam.*
windowrule = idle_inhibit fullscreen, match:class steam

# Emulation / game streaming
windowrule = fullscreen on, match:class com.libretro.RetroArch
windowrule = tag -nejen-glass, match:class com.libretro.RetroArch
windowrule = opacity 1 1, match:class com.libretro.RetroArch
windowrule = idle_inhibit fullscreen, match:class com.libretro.RetroArch
windowrule = idle_inhibit fullscreen, match:class GeForceNOW

# Anything tagged noidle keeps the machine awake while open
windowrule = idle_inhibit always, match:tag noidle
