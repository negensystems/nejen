# NEJEN surface: how windows look and move. Colors are deliberately
# absent -- they come from the rendered theme, sourced later.

general {
  gaps_in = 4
  gaps_out = 8
  border_size = 2
  layout = dwindle
  resize_on_border = true
}

decoration {
  rounding = 6
  active_opacity = 1.0
  inactive_opacity = 0.94

  shadow {
    enabled = true
    range = 14
    render_power = 3
    color = rgba(00000033)
    color_inactive = rgba(00000018)
  }

  blur {
    enabled = true
    size = 4
    passes = 2
    ignore_opacity = true
  }
}

# Motion: quick to settle, no bounce. One curve for movement, a faster
# one for fades, so the desktop feels crisp rather than springy.
animations {
  enabled = true
  bezier = nejenSettle, 0.22, 0.9, 0.28, 1.0
  bezier = nejenFade, 0.4, 0.0, 0.6, 1.0
  animation = windows, 1, 3, nejenSettle, popin 90%
  animation = windowsOut, 1, 3, nejenFade, popin 90%
  animation = fade, 1, 2, nejenFade
  animation = workspaces, 1, 3, nejenSettle, slide
  animation = layers, 1, 2, nejenFade, fade
  animation = border, 1, 4, default
}

dwindle {
  preserve_split = true
  force_split = 2
}

master {
  mfact = 0.55
  new_status = slave
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  focus_on_activate = true
  key_press_enables_dpms = true
  mouse_move_enables_dpms = true
}
