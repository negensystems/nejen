# Cleaning mode (`nejen keyboard clean`).
#
# The submap below is how NEJEN turns the keyboard off. While it is the
# active submap the `catchall` bind matches every key press -- with or
# without modifiers -- and hands it to a global shortcut nothing has
# claimed, so the press does nothing and never reaches the focused
# window. A cloth dragged across the keys types nothing, opens nothing,
# and cannot answer a dialog.
#
# `nejen keyboard clean` owns entering and leaving this submap. It always
# schedules the way out (a deadline, an explicit stop, `nejen keyboard
# status` reaping a dead session), so the submap cannot strand a machine
# without a keyboard. Reloading Hyprland also drops back to the default
# submap.
#
# The pointer is left alone on purpose: it is the escape hatch. Stray
# taps land on the full-screen cleaning overlay and do nothing, the
# waybar indicator stays clickable, and a middle click -- the one button
# a palm or a cloth will not press by accident -- ends cleaning early.

submap = nejen-clean

# `nejen:cleaning-noop` is deliberately a shortcut no client has taken:
# Hyprland's global dispatcher returns immediately when the name is
# unclaimed, so this swallows a key without forking or logging.
bind = , catchall, global, nejen:cleaning-noop

bind = , mouse:274, exec, nejen keyboard clean --stop

submap = reset
