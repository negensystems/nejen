# NEJEN hyprlock. The entire themed lock screen (colors and layout) is
# rendered from $NEJEN_PATH/templates/hyprlock.conf.tmpl by `nejen theme set`;
# this file only pulls in the rendered result.
#
# Loaded through the thin ~/.config/hypr/hyprlock.conf written by install.sh.
# Personal tweaks belong in ~/.config/hypr/hyprlock-overrides.conf, which is
# sourced after this file.
source = ~/.local/state/nejen/theme/hyprlock.conf
