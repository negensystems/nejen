# This machine's input preferences (wins over core/devices.conf).

input {
  kb_layout = us
  kb_options = caps:capslock

  # Snappy key repeat
  repeat_rate = 40
  repeat_delay = 600

  numlock_by_default = true

  # Pointer runs a bit hot on this trackpad
  sensitivity = 0.35

  touchpad {
    natural_scroll = true
    clickfinger_behavior = true
    scroll_factor = 0.4
  }
}

# Four-finger swipe switches workspaces (three-finger is the core default)
gesture = 4, horizontal, workspace
