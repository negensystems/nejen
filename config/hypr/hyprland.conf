# NEJEN Hyprland entry point.
#
# Loaded through the thin ~/.config/hypr/hyprland.conf written by
# install.sh; the user's ~/.config/hypr/overrides.conf is sourced after
# this whole file and wins over everything here. $NEJEN_PATH is exported
# at session launch by uwsm (config/uwsm/env).
#
# Precedence, lowest to highest: core defaults -> rendered keymap ->
# rendered theme -> this machine's setup -> user overrides.

source = $NEJEN_PATH/config/hypr/core/session.conf
source = $NEJEN_PATH/config/hypr/core/surface.conf
source = $NEJEN_PATH/config/hypr/core/devices.conf
source = $NEJEN_PATH/config/hypr/core/rules.conf

# Keybindings, rendered from keymap.toml by `nejen keymap render`.
# Rebind in ~/.config/nejen/keymap.toml, never here.
source = ~/.local/state/nejen/keymap/hyprland.conf

# Active theme (border colors etc), written by `nejen theme set`
source = ~/.local/state/nejen/theme/hyprland.conf

# This machine's opinionated setup
source = $NEJEN_PATH/config/hypr/monitors.conf
source = $NEJEN_PATH/config/hypr/input.conf
source = $NEJEN_PATH/config/hypr/envs.conf
source = $NEJEN_PATH/config/hypr/theme.conf
source = $NEJEN_PATH/config/hypr/autostart.conf
source = $NEJEN_PATH/config/hypr/local.conf
