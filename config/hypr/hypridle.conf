# NEJEN idle policy.
#
# Timeline: 2.5 min screensaver -> 5 min lock -> 5.5 min displays off.
# `nejen idle toggle` (caffeine) stops/starts hypridle wholesale, so
# nothing here needs a bypass flag.

general {
    lock_cmd = nejen lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on
    inhibit_sleep = 3
}

# Screensaver, unless the screen is already locked
listener {
    timeout = 150
    on-timeout = pidof hyprlock || nejen screensaver show
}

# Lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Keyboard backlight off, restored on activity
listener {
    timeout = 330
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

# Displays off, restored on activity
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}
