# ── Capture ─────────────────────────────────────────────────────────────

[[bind]]
keys = "print"
desc = "Screenshot (select region)"
run = "nejen screenshot"
group = "capture"

[[bind]]
keys = "shift+print"
desc = "Screenshot (whole screen)"
run = "nejen screenshot fullscreen"
group = "capture"

[[bind]]
keys = "super+print"
desc = "Screenshot (window)"
run = "nejen screenshot windows"
group = "capture"

[[bind]]
keys = "super+r"
desc = "Screen record toggle"
run = "nejen screenrecord"
group = "capture"

[[bind]]
keys = "super+shift+r"
desc = "Screen record stop"
run = "nejen screenrecord --stop"
group = "capture"

[[bind]]
keys = "super+ctrl+p"
desc = "Color picker"
run = "pkill hyprpicker || hyprpicker -a"
group = "capture"

# ── Hardware keys ───────────────────────────────────────────────────────

[[bind]]
keys = "XF86AudioRaiseVolume"
desc = "Volume up"
run = "swayosd-client --output-volume raise"
flags = "el"
group = "hardware"

[[bind]]
keys = "XF86AudioLowerVolume"
desc = "Volume down"
run = "swayosd-client --output-volume lower"
flags = "el"
group = "hardware"

[[bind]]
keys = "XF86AudioMute"
desc = "Mute"
run = "swayosd-client --output-volume mute-toggle"
flags = "l"
group = "hardware"

[[bind]]
keys = "XF86AudioMicMute"
desc = "Mute microphone"
run = "swayosd-client --input-volume mute-toggle"
flags = "l"
group = "hardware"

[[bind]]
keys = "XF86AudioPlay"
desc = "Play / pause"
run = "playerctl play-pause"
flags = "l"
group = "hardware"

[[bind]]
keys = "XF86AudioNext"
desc = "Next track"
run = "playerctl next"
flags = "l"
group = "hardware"

[[bind]]
keys = "XF86AudioPrev"
desc = "Previous track"
run = "playerctl previous"
flags = "l"
group = "hardware"

[[bind]]
keys = "XF86MonBrightnessUp"
desc = "Screen brightness up"
run = "swayosd-client --brightness raise"
flags = "el"
group = "hardware"

[[bind]]
keys = "XF86MonBrightnessDown"
desc = "Screen brightness down"
run = "swayosd-client --brightness lower"
flags = "el"
group = "hardware"

[[bind]]
keys = "XF86KbdLightOnOff"
desc = "Cycle keyboard backlight"
run = "nejen brightness keyboard cycle"
group = "hardware"

[[bind]]
keys = "Caps_Lock"
desc = "Caps lock indicator"
run = "swayosd-client --caps-lock"
flags = "r"
group = "hardware"

# ── Notifications ───────────────────────────────────────────────────────

[[bind]]
keys = "super+d"
desc = "Dismiss notification"
run = "makoctl dismiss"
group = "notifications"

[[bind]]
keys = "super+shift+d"
desc = "Dismiss all notifications"
run = "makoctl dismiss --all"
group = "notifications"

[[bind]]
keys = "super+ctrl+d"
desc = "Do not disturb"
run = "nejen dnd toggle"
group = "notifications"

# ── Toggles ─────────────────────────────────────────────────────────────

[[bind]]
keys = "super+b"
desc = "Toggle bar"
run = "nejen bar toggle"
group = "toggles"

[[bind]]
keys = "super+w"
desc = "Toggle nightlight (warmth)"
run = "nejen night toggle"
group = "toggles"

[[bind]]
keys = "super+i"
desc = "Toggle idle lock (caffeine)"
run = "nejen idle toggle"
group = "toggles"

# Deliberately a three-finger chord. Every other toggle here is cheap to
# hit by accident; this one takes the keyboard away for half a minute.
[[bind]]
keys = "super+alt+k"
desc = "Cleaning mode (keyboard off to wipe)"
run = "nejen keyboard clean"
group = "toggles"

# ── Theme ───────────────────────────────────────────────────────────────

[[bind]]
keys = "super+shift+w"
desc = "Wallpaper picker"
run = "nejen theme bg pick"
group = "theme"

[[bind]]
keys = "super+ctrl+w"
desc = "Next wallpaper"
run = "nejen theme bg next"
group = "theme"

[[bind]]
keys = "super+ctrl+shift+w"
desc = "Previous wallpaper"
run = "nejen theme bg prev"
group = "theme"
