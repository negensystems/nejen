# NEJEN default keymap.
#
# This file is the single source of truth for every shipped keybinding.
# `nejen keymap render` turns it into Hyprland bind lines; `nejen keys`
# shows it as the searchable key reference. Rebind keys by writing
# ~/.config/nejen/keymap.toml (same schema): a [[bind]] with the same
# `keys` replaces the default, new chords are added, and
# `unbind = ["super+x"]` removes a default outright.
#
# The scheme, in one breath: Super+key acts on the focused window or a
# core app; Shift strengthens or inverts; Ctrl reaches the less common
# variant; Super+N is NEJEN's hub for everything that has no key.

# ── Apps ────────────────────────────────────────────────────────────────

[[bind]]
keys = "super+return"
desc = "Terminal (in current project dir)"
run = "uwsm-app -- xdg-terminal-exec --dir=\"$(nejen terminal cwd)\""
group = "apps"

[[bind]]
keys = "super+alt+return"
desc = "Terminal with tmux"
run = "uwsm-app -- xdg-terminal-exec --dir=\"$(nejen terminal cwd)\" tmux new"
group = "apps"

[[bind]]
keys = "super+space"
desc = "App launcher"
run = "nejen open launcher"
group = "apps"

[[bind]]
keys = "super+period"
desc = "Emoji picker"
run = "nejen open launcher -m symbols"
group = "apps"

[[bind]]
keys = "super+shift+b"
desc = "Browser"
run = "nejen open browser"
group = "apps"

[[bind]]
keys = "super+shift+alt+b"
desc = "Browser (private window)"
run = "nejen open browser --private"
group = "apps"

[[bind]]
keys = "super+shift+e"
desc = "Editor"
run = "nejen open editor"
group = "apps"

[[bind]]
keys = "super+shift+t"
desc = "System activity (btop)"
run = "nejen open tui btop"
group = "apps"

# ── Clipboard ───────────────────────────────────────────────────────────
#
# Ctrl+C means SIGINT in a terminal, so no single chord copies everywhere.
# `nejen clip` gives Super+C/Super+V that meaning instead: it replays the
# chord the focused window understands (Ctrl+Shift in terminals, plain
# Ctrl elsewhere) into that window.

[[bind]]
keys = "super+c"
desc = "Copy"
run = "nejen clip copy"
group = "clipboard"

[[bind]]
keys = "super+v"
desc = "Paste"
run = "nejen clip paste"
group = "clipboard"

[[bind]]
keys = "super+ctrl+v"
desc = "Clipboard history"
run = "nejen open launcher -m clipboard"
group = "clipboard"

# ── Hub & session ───────────────────────────────────────────────────────

[[bind]]
keys = "super+n"
desc = "NEJEN hub"
run = "nejen hub"
group = "hub"

[[bind]]
keys = "super+shift+n"
desc = "Session menu (lock/logout/power)"
run = "nejen hub session"
group = "hub"

[[bind]]
keys = "XF86PowerOff"
desc = "Session menu"
run = "nejen hub session"
flags = "l"
group = "hub"

[[bind]]
keys = "super+/"
desc = "Key reference"
run = "nejen keys"
group = "hub"

[[bind]]
keys = "ctrl+escape"
desc = "Lock screen"
run = "nejen lock"
group = "hub"

# ── Windows ─────────────────────────────────────────────────────────────

[[bind]]
keys = "super+q"
desc = "Close window"
action = "killactive"
group = "windows"

[[bind]]
keys = "super+h"
desc = "Focus left"
action = "movefocus l"
group = "windows"

[[bind]]
keys = "super+j"
desc = "Focus down"
action = "movefocus d"
group = "windows"

[[bind]]
keys = "super+k"
desc = "Focus up"
action = "movefocus u"
group = "windows"

[[bind]]
keys = "super+l"
desc = "Focus right"
action = "movefocus r"
group = "windows"

[[bind]]
keys = "super+shift+h"
desc = "Move window left"
action = "movewindow l"
group = "windows"

[[bind]]
keys = "super+shift+j"
desc = "Move window down"
action = "movewindow d"
group = "windows"

[[bind]]
keys = "super+shift+k"
desc = "Move window up"
action = "movewindow u"
group = "windows"

[[bind]]
keys = "super+shift+l"
desc = "Move window right"
action = "movewindow r"
group = "windows"

[[bind]]
keys = "super+ctrl+h"
desc = "Shrink window horizontally"
action = "resizeactive -60 0"
flags = "e"
group = "windows"

[[bind]]
keys = "super+ctrl+l"
desc = "Grow window horizontally"
action = "resizeactive 60 0"
flags = "e"
group = "windows"

[[bind]]
keys = "super+ctrl+k"
desc = "Shrink window vertically"
action = "resizeactive 0 -60"
flags = "e"
group = "windows"

[[bind]]
keys = "super+ctrl+j"
desc = "Grow window vertically"
action = "resizeactive 0 60"
flags = "e"
group = "windows"

[[bind]]
keys = "super+f"
desc = "Fullscreen"
action = "fullscreen"
group = "windows"

[[bind]]
keys = "super+shift+f"
desc = "Maximize (keep bar)"
action = "fullscreen 1"
group = "windows"

[[bind]]
keys = "super+t"
desc = "Toggle floating"
action = "togglefloating"
group = "windows"

[[bind]]
keys = "super+u"
desc = "Detach window (pinned float)"
run = "nejen win detach"
group = "windows"

[[bind]]
keys = "super+g"
desc = "Toggle gaps"
run = "nejen win gaps"
group = "windows"

[[bind]]
keys = "super+y"
desc = "Toggle tiling layout"
run = "nejen win layout"
group = "windows"

[[bind]]
keys = "super+o"
desc = "Square aspect for lone window"
run = "nejen win square"
group = "windows"

[[bind]]
keys = "super+mouse:272"
desc = "Drag window"
action = "movewindow"
flags = "m"
group = "windows"

[[bind]]
keys = "super+mouse:273"
desc = "Resize window"
action = "resizewindow"
flags = "m"
group = "windows"

