#? NEJEN btop seed config.
#
# Only NEJEN's deliberate choices live here - btop supplies defaults for every
# key that is absent, and rewrites this file itself the first time the user
# saves from its options menu (which is why the installer copies it once
# instead of symlinking it).

# "current" resolves through ~/.config/btop/themes/current.theme, which the
# installer symlinks to the theme engine's rendered file at
# ~/.local/state/nejen/theme/btop.theme - so btop follows `nejen theme set`.
color_theme = "current"

# h/j/k/l/g/G navigation in every list (help and kill move to shift).
vim_keys = True

# 2s sampling: calm graphs, negligible overhead.
update_ms = 2000

# Follow the busiest process over time instead of flickering per sample.
proc_sorting = "cpu lazy"

# Absolute memory per process beats percentages for spotting hogs.
proc_mem_bytes = True

# Package power draw in the CPU box (needs setcap/setuid or root to report).
show_cpu_watts = True
